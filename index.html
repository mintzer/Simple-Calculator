<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Python Calculator</title>
  </head>
  <body>
    <div id="calculator-container">
      <div id="title">Python Calculator</div>

      <input type="text" id="num1" />
      <input type="text" id="num2" />

      <div id="operation-label"></div>
      <div id="result-display"></div>

      <button id="plus-btn" class="operation-button">+</button>
      <button id="minus-btn" class="operation-button">-</button>
      <button id="multiply-btn" class="operation-button">×</button>
      <button id="divide-btn" class="operation-button">÷</button>

      <button id="author-btn">Author</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
