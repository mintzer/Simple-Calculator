<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Python Calculator</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="calculator-container">
        <!-- Title matching Python's "Python Calculator" (line 181) -->
        <h1 class="title">Python Calculator</h1>

        <!-- Input fields for two numbers (lines 185-188) -->
        <div class="input-section">
            <input type="text" id="num1" class="number-input" placeholder="Enter first number" aria-label="First number">
            <input type="text" id="num2" class="number-input" placeholder="Enter second number" aria-label="Second number">
        </div>

        <!-- Display areas for operation name and result (lines 183-184) -->
        <div class="result-section">
            <div id="operation-name" class="operation-display"></div>
            <div id="result" class="result-display"></div>
        </div>

        <!-- Error message display area (hidden by default) -->
        <div id="error-message" class="error-message" role="alert" aria-live="polite"></div>

        <!-- Operation buttons (lines 190-200) -->
        <div class="button-section">
            <button id="btn-add" class="operation-button" aria-label="Addition">+</button>
            <button id="btn-subtract" class="operation-button" disabled aria-label="Subtraction">-</button>
            <button id="btn-multiply" class="operation-button" disabled aria-label="Multiplication">*</button>
            <button id="btn-divide" class="operation-button" disabled aria-label="Division">/</button>
        </div>

        <!-- Author button (lines 202-203) -->
        <div class="author-section">
            <button id="btn-author" class="author-button" aria-label="Author information">Author</button>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
